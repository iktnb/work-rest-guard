name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore, verify, test, and publish
        shell: pwsh
        run: |
          dotnet restore WorkRestGuard.slnx
          dotnet build WorkRestGuard.slnx -c Release --no-restore
          dotnet test tests/WorkRestGuard.Tests/WorkRestGuard.Tests.csproj -c Release --no-build
          dotnet format WorkRestGuard.slnx --verify-no-changes --no-restore
          dotnet publish src/WorkRestGuard/WorkRestGuard.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/win-x64
          $hash = (Get-FileHash artifacts/win-x64/WorkRestGuard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WorkRestGuard.exe" | Set-Content artifacts/win-x64/WorkRestGuard.exe.sha256 -Encoding ascii

      - name: Attest executable provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: artifacts/win-x64/WorkRestGuard.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'artifacts/win-x64/WorkRestGuard.exe#WorkRestGuard.exe' `
            'artifacts/win-x64/WorkRestGuard.exe.sha256#SHA-256-checksum' `
            --repo $env:GITHUB_REPOSITORY `
            --title "Work Rest Guard $env:GITHUB_REF_NAME" `
            --generate-notes
